# The global pinning puts the CUDA 12 row on glibc 2.17, but the binaries NVIDIA ships
# reference symbols up to GLIBC_2.27, so keep that row on 2.28.
# c_stdlib_version is zipped with c/cxx/fortran_compiler_version and cuda_compiler_version,
# so this list has to have same number of entries.
c_stdlib_version:              # [unix]
  - 2.17                       # [linux]
  - 2.28                       # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  - 2.28                       # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
